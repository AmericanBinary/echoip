# PDT image: a manual build of one branch as v<version>-pdt.<N> with the
# GeoIP database baked in, for the ab-acc PDT builds (ACC
# ab-packages/ab-acc/pdt-values.yaml pins it as stack.echoip.tag).
# Modelled on administrator-panel .github/workflows/pdt-image.yaml.
#
# - Manual only (workflow_dispatch). Inputs: the branch to build and N.
#   Nothing is built or published on a push or a pull request (see
#   "Dispatching" below for the one pull_request trigger, which only
#   registers the workflow).
# - <version> is version/version.go on that branch. It must be newer than
#   the latest release tag (git tag v<x.y.z>) and not already published as
#   ghcr.io/americanbinary/echoip:v<version> (build.yaml pushes that from
#   master), because a PDT build is of an unreleased version.
# - Published as ghcr.io/americanbinary/echoip:v<version>-pdt.<N> (and
#   -amd64/-arm64) and repo.edge.ambit.inc/echoip:v<version>-pdt.<N>. Never
#   latest, never a release tag, never repo.dev.edge.ambit.inc.
# - Create-only: a tag that exists in either registry is refused, so a
#   number is never reused.
# - The image is pdt/jib.yaml: the layout of jib.yaml (build.yaml), plus
#   /opt/echoip/data/*.mmdb and the entrypoint pdt/entrypoint.sh, which
#   passes -f/-c/-a for the databases present.
#
# GeoIP database (job geoip): DB-IP IP to Country Lite (CC BY 4.0, MaxMind DB
# format) from GEOIP_URL, checked against GEOIP_SHA256 (of the .mmdb) and by a
# lookup of 8.8.8.8 (US); baked in as /opt/echoip/data/country.mmdb with
# LICENSE.txt (the DB-IP attribution and license) and SOURCE.txt. The same
# single input as ACC .github/workflows/pdt.yaml: a newer month is its URL and
# the sha256 of its .mmdb.
#
# Dispatching. GitHub's rule (docs.github.com, "Events that trigger
# workflows", workflow_dispatch): the "Run workflow" button is shown only if
# the workflow file exists on the default branch, and "once a workflow has
# run at least once, you can dispatch it against any branch or tag via the
# GitHub API or GitHub CLI". The run uses the workflow file of the ref it is
# dispatched on. This file is not on master, so:
#   1. It is registered by its first run: the pull_request trigger below
#      (a pull request into pdt/develop that changes this file) runs only
#      the "register" job, which builds and publishes nothing.
#   2. Then, from any branch that contains this file:
#        gh workflow run pdt-image.yaml --ref <branch with this file> \
#          -f ref=<branch to build> -f pdt_number=<N>
#      (no UI button until the file is on master).
name: PDT image

defaults:
  run:
    shell: bash

env:
  APP: echoip
  APP_PKG: ./cmd/echoip
  # https://github.com/GoogleContainerTools/jib/releases/tag/v0.13.0-cli
  JIB_VERSION: '0.13.0'
  # GeoIP database (see above)
  GEOIP_URL: https://download.db-ip.com/free/dbip-country-lite-2026-11.mmdb.gz
  GEOIP_SHA256: 145ce5dfb812d8de28547e6289bb5c5f8b3df2f1dea21d324d5b575e0431311f

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (not master; empty = the branch this run is dispatched on)'
        required: false
        type: string
        default: ''
      pdt_number:
        description: 'N of v<version>-pdt.<N> (1, 2, ...; never reused)'
        required: true
        type: string
  # Registration only (see "Dispatching" above): runs the register job.
  pull_request:
    branches: [pdt/develop]
    paths: [.github/workflows/pdt-image.yaml]

permissions:
  contents: read

concurrency:
  group: pdt-image-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "PDT image workflow registered. Nothing was built or published."
            echo "Dispatch: gh workflow run pdt-image.yaml --ref <branch with this file> -f ref=<branch> -f pdt_number=<N>"
          } >> "${GITHUB_STEP_SUMMARY}"

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: '0'
      - id: plan
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          N: ${{ inputs.pdt_number }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          if [[ "${REF}" == "${DEFAULT_BRANCH}" || "${REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::build a branch, not ${DEFAULT_BRANCH} (${DEFAULT_BRANCH} is released by build.yaml)"; exit 1
          fi
          if ! [[ "${N}" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::pdt_number must be a positive integer, got '${N}'"; exit 1
          fi
          VERSION="$(grep 'const Version' version/version.go | awk '{print $NF}' | tr -d '"')"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version/version.go has '${VERSION}', not x.y.z"; exit 1
          fi
          LATEST="$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "${LATEST}" ]] && [[ "$(printf '%s\n%s\n' "${LATEST}" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" || "${LATEST}" == "${VERSION}" ]]; then
            echo "::error::version ${VERSION} is not newer than the latest release v${LATEST}: bump version/version.go on the branch"; exit 1
          fi
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          if docker buildx imagetools inspect "ghcr.io/americanbinary/${APP}:v${VERSION}" >/dev/null 2>&1; then
            echo "::error::ghcr.io/americanbinary/${APP}:v${VERSION} is already released: bump version/version.go on the branch"; exit 1
          fi
          TAG="v${VERSION}-pdt.${N}"
          if docker buildx imagetools inspect "ghcr.io/americanbinary/${APP}:${TAG}" >/dev/null 2>&1; then
            echo "::error::ghcr.io/americanbinary/${APP}:${TAG} exists; PDT numbers are never reused (use the next N)"; exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          {
            echo "tag=${TAG}"
            echo "sha=${SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "PDT image ${TAG} from ${REF} at ${SHA}" >> "${GITHUB_STEP_SUMMARY}"

  geoip:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: fetch the GeoIP database (GEOIP_URL, sha256 and lookup checked)
        run: |
          set -eu -o pipefail
          mkdir -p data
          sudo apt-get install -y -qq mmdb-bin >/dev/null
          curl -fsSL --retry 3 -m 600 -o download "${GEOIP_URL}"
          case ${GEOIP_URL%%\?*} in
            *.gz) gunzip -c download > data/country.mmdb ;;
            *)    mv download data/country.mmdb ;;
          esac
          rm -f download
          echo "${GEOIP_SHA256}  data/country.mmdb" | sha256sum -c -
          cc=$(mmdblookup --file data/country.mmdb --ip 8.8.8.8 country iso_code | grep -oE '"[A-Z]{2}"' | tr -d '"')
          [[ ${cc} == US ]] || { echo "::error::${GEOIP_URL} resolves 8.8.8.8 to '${cc}', not US"; exit 1; }
          cp pdt/geoip-LICENSE.txt data/LICENSE.txt
          echo "source ${GEOIP_URL} (downloaded $(date -u +%F)), sha256 ${GEOIP_SHA256}" > data/SOURCE.txt
          {
            echo "GeoIP database:"
            echo '```'
            ls -l data
            cat data/SOURCE.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: geoip-data
          path: data
          retention-days: 1

  image:
    needs: [plan, geoip]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          # static, no libc: the same binary runs on any base
          CGO_ENABLED: '0'
        run: |
          set -eux -o pipefail
          go build -v -trimpath -o "${APP}_linux_${GOARCH}" -tags netgo,osusergo "${APP_PKG}"
      - uses: actions/download-artifact@v8
        with:
          name: geoip-data
          path: data
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - run: |
          set -eux -o pipefail
          wget -q "https://github.com/GoogleContainerTools/jib/releases/download/v${JIB_VERSION}-cli/jib-jre-${JIB_VERSION}.zip"
          unzip -q "./jib-jre-${JIB_VERSION}.zip"
          sudo ln -fs "$PWD/jib-${JIB_VERSION}/bin/jib" /usr/bin
          jib --version
      - name: jib build ${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.plan.outputs.tag }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu -o pipefail
          jib build \
            --build-file pdt/jib.yaml \
            --parameter arch="${ARCH}" \
            --parameter file="${APP}_linux_${ARCH}" \
            --target "ghcr.io/americanbinary/${APP}:${TAG}-${ARCH}" \
            --from-username "AmericanBinaryDevSecOps" \
            --from-password "${DEPLOY_TOKEN}" \
            --to-username "${ACTOR}" \
            --to-password "${GITHUB_TOKEN}" \
          ;

  publish:
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      ETAG: ${{ needs.plan.outputs.tag }}
      TARGET_REPO: repo.edge.ambit.inc
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::372108847118:role/prod-image-reg-registry-push'
      - run: |
          # xtrace is intentionally disabled: this step handles registry credentials
          set -eu -o pipefail
          set +x
          client_id=$(aws ssm get-parameter --with-decryption --name /prod/image-reg-auth-gha/repo-app-client-id --output text --query Parameter.Value)
          client_secret=$(aws ssm get-parameter --with-decryption --name /prod/image-reg-auth-gha/repo-app-client-secret --output text --query Parameter.Value)
          echo "::add-mask::${client_id}"
          echo "::add-mask::${client_secret}"
          token=$(
            curl -fSs -X POST "https://login.microsoftonline.com/3390a7ac-e80c-4cf8-a217-02099a3a22b7/oauth2/v2.0/token" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "client_id=${client_id}" \
              --data-urlencode "client_secret=${client_secret}" \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode "scope=api://prod-repo-int-app/.default" \
              | jq -r .access_token
          )
          echo "::add-mask::${token}"
          printf '%s' "${token}" | docker login "${TARGET_REPO}" -u Ambit --password-stdin
      - env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: publish ${{ env.ETAG }} (create-only, never latest)
        run: |
          set -eux -o pipefail
          for img in "ghcr.io/americanbinary/${APP}:${ETAG}" "${TARGET_REPO}/${APP}:${ETAG}"; do
            if docker buildx imagetools inspect "${img}" >/dev/null 2>&1; then
              echo "::error::${img} exists; PDT numbers are never reused"; exit 1
            fi
          done
          for target in "ghcr.io/americanbinary/${APP}:${ETAG}" "${TARGET_REPO}/${APP}:${ETAG}"; do
            docker buildx imagetools create \
              --tag "${target}" \
              "ghcr.io/americanbinary/${APP}:${ETAG}-amd64" \
              "ghcr.io/americanbinary/${APP}:${ETAG}-arm64" \
              ;
          done
          DIGEST="$(docker buildx imagetools inspect "${TARGET_REPO}/${APP}:${ETAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "Published ${TARGET_REPO}/${APP}:${ETAG} (${DIGEST}) and ghcr.io/americanbinary/${APP}:${ETAG}"
            echo "Pin it in ACC ab-packages/ab-acc/pdt-values.yaml as stack.echoip.tag \"${ETAG}\"."
          } >> "${GITHUB_STEP_SUMMARY}"
