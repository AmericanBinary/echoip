apiVersion: jib/v1alpha1
kind: BuildFile

from:
  image: ghcr.io/americanbinary/container-images-base-alpine:latest
  platforms:
    - architecture: ${arch}
      os: linux

creationTime: 1970-01-01T00:00:01Z
format: Docker

# Same layout as the Dockerfile: the helm charts run /opt/echoip/echoip, and the
# default template dir ("html") is relative to the working directory.
workingDirectory: /opt/echoip

entrypoint:
  - /opt/echoip/echoip
  - "-p"
  - "-r"
  - "-H"
  - "X-Forwarded-For"

layers:
  entries:
    - name: app
      files:
        - src: ${file}
          dest: /opt/echoip/echoip
          properties:
            filePermissions: 755
        - src: html
          dest: /opt/echoip/html
